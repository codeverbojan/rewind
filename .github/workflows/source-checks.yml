name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Public-tree checks
        run: python3 tools/check_public_repo.py
      - name: Portable policy tests
        run: python3 tools/run_portable_checks.py
